[package]
name = "fast-umap"
version = "1.6.0"
description = "Configurable UMAP (Uniform Manifold Approximation and Projection) in Rust"
keywords = ["UMAP", "dimensionality", "manifold", "machine-learning", "GPU"]
categories = ["science", "mathematics", "visualization"]
authors = ["Eugene Hauptmann"]
repository = "https://github.com/eugenehp/fast-map"
homepage = "https://github.com/eugenehp/fast-map"
documentation = "https://docs.rs/fast-umap/latest/fast_umap/"
license = "MIT"
edition = "2021"

# docs.rs build configuration.
# `all-features = true`  — build docs with every feature enabled so nothing
#                          is hidden behind a flag.
# `rustdoc-args`         — pass --cfg docsrs so that doc-only items gated with
#                          #[cfg(docsrs)] (e.g. nightly doc_cfg annotations)
#                          are included in the rendered output.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

exclude = ["figures/*"]

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "train", "autodiff", "autotune", "ndarray"] }
burn-cubecl = { version = "0.20.1", optional = true }
# burn-jit = { version = "0.16.1", features = ["burn-autodiff"] }
crossbeam-channel = "0.5.15"
ctrlc = "3.4.7"
cubecl = { version = "0.9.0", features = ["wgpu"], optional = true }
hsl = { version = "0.1.1", optional = true }
indicatif = "0.18"
ndarray = "0.16.1"
num = "0.4.3"
num-traits = "0.2.19"
plotters = { version = "0.3.7", optional = true }
prettytable = "0.10.0"
umap-rs = { version = "0.4.5", optional = true }
burn-mlx = { version = "0.1.2", git = "https://github.com/eidolons-ai/burn-mlx", branch = "burn-0-20", optional = true }
# burn-candle = { version = "0.20.1", optional = true }  # TODO: re-enable when burn-candle fixes candle-core DType compat
rand = "0.9.2"
rayon = "1.10.0"
serde = "1.0.216"

[dev-dependencies]
burn = { version = "0.20.1", features = ["ndarray", "autodiff"] }
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
mnist = { version = "0.6.0", git = "https://github.com/eugenehp/mnist.git", features = ["download"] }
umap-rs = "0.4.5"
ndarray_017 = { package = "ndarray", version = "0.17" }
serde_json = "1.0"
chrono = "0.4"

[[bench]]
name = "umap_bench"
harness = false

[[example]]
name = "serialization_demo"
required-features = ["gpu"]

[[example]]
name = "benchmark_serialization"
required-features = ["gpu"]

[[example]]
name = "benchmark_scalability"
required-features = ["gpu"]

[[example]]
name = "bench_mnist"
required-features = ["gpu", "plotters"]

[[example]]
name = "mnist_benchmark"
required-features = ["gpu", "plotters"]

[[example]]
name = "crate_comparison"
required-features = ["gpu", "plotters"]

[[example]]
name = "advanced"
required-features = ["gpu"]

[[example]]
name = "backend_choice"
required-features = ["gpu"]

[[example]]
name = "simple"
required-features = ["gpu"]

[[example]]
name = "mnist"
required-features = ["gpu", "plotters"]

[[example]]
name = "fallback_demo"
required-features = ["gpu", "cpu"]

[[example]]
name = "backend_benchmark"
required-features = ["gpu"]

[[example]]
name = "pca_comparison"
required-features = ["mlx", "pca"]

[[example]]
name = "large_scale"
required-features = ["mlx", "nn-descent"]


[[bin]]
name = "bench_report"
required-features = ["gpu"]

[features]
default = ["gpu", "verbose"]
# Core backend features
gpu = ["burn/wgpu", "dep:burn-cubecl", "dep:cubecl"]  # GPU backend with WGPU support
cpu = ["dep:umap-rs"]  # CPU backend with umap-rs fallback
mlx = ["dep:burn-mlx"]  # MLX backend for Apple Silicon
# candle = ["dep:burn-candle"]  # Candle backend — blocked on burn-candle/candle-core DType compat
# Optional features
pca = []  # PCA warm-start for initial embedding
nn-descent = []  # Approximate KNN via NN-Descent for large datasets
verbose = []  # Verbose output and progress bars
plotters = ["dep:plotters", "dep:hsl"]  # Plotting support
# Combined features for convenience
all = ["gpu", "cpu", "mlx", "pca", "nn-descent", "verbose", "plotters"]
