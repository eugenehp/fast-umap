<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="wgpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#4180B6"/>
    </linearGradient>
    <linearGradient id="mlx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ED7D31"/>
      <stop offset="100%" stop-color="#D4692A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#333">WGPU vs MLX Backend Benchmark</text>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#888">50 epochs, Apple Silicon, lower is better (seconds)</text>

  <!-- Chart area: x=140..770, y=70..440 -->
  <!-- Y axis -->
  <line x1="140" y1="65" x2="140" y2="440" stroke="#CCC" stroke-width="1"/>

  <!-- Y gridlines: 0 to 14s, scale = (440-65)/14 = 26.8px per second -->
  <line x1="140" y1="440" x2="770" y2="440" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="444" text-anchor="end" font-size="10" fill="#999">0s</text>
  <line x1="140" y1="386.4" x2="770" y2="386.4" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="390" text-anchor="end" font-size="10" fill="#999">2s</text>
  <line x1="140" y1="332.9" x2="770" y2="332.9" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="337" text-anchor="end" font-size="10" fill="#999">4s</text>
  <line x1="140" y1="279.3" x2="770" y2="279.3" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="283" text-anchor="end" font-size="10" fill="#999">6s</text>
  <line x1="140" y1="225.7" x2="770" y2="225.7" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="230" text-anchor="end" font-size="10" fill="#999">8s</text>
  <line x1="140" y1="172.1" x2="770" y2="172.1" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="176" text-anchor="end" font-size="10" fill="#999">10s</text>
  <line x1="140" y1="118.6" x2="770" y2="118.6" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="123" text-anchor="end" font-size="10" fill="#999">12s</text>
  <line x1="140" y1="65" x2="770" y2="65" stroke="#EEE" stroke-width="0.5"/>
  <text x="130" y="69" text-anchor="end" font-size="10" fill="#999">14s</text>

  <!-- X axis -->
  <line x1="140" y1="440" x2="770" y2="440" stroke="#CCC" stroke-width="1"/>

  <!-- scale: 1s = 26.79px. bar_y = 440 - val*26.79 -->
  <!-- Bars: 9 paired scenarios, spacing ~68px each, bar width 25px -->

  <!-- 500x20: WGPU=2.49 MLX=0.10 -->
  <g transform="translate(160,0)">
    <rect x="0" y="373.3" width="25" height="66.7" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="369" text-anchor="middle" font-size="8" fill="#4180B6">2.5s</text>
    <rect x="28" y="437.3" width="25" height="2.7" rx="2" fill="url(#mlx)"/>
    <text x="40" y="434" text-anchor="middle" font-size="8" fill="#D4692A">0.1s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">500x20</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">25x</text>
  </g>

  <!-- 1Kx50: WGPU=1.65 MLX=0.08 -->
  <g transform="translate(228,0)">
    <rect x="0" y="395.8" width="25" height="44.2" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="392" text-anchor="middle" font-size="8" fill="#4180B6">1.7s</text>
    <rect x="28" y="437.9" width="25" height="2.1" rx="2" fill="url(#mlx)"/>
    <text x="40" y="434" text-anchor="middle" font-size="8" fill="#D4692A">0.1s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">1Kx50</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">21x</text>
  </g>

  <!-- 5Kx100: WGPU=4.94 MLX=0.34 -->
  <g transform="translate(296,0)">
    <rect x="0" y="307.7" width="25" height="132.3" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="303" text-anchor="middle" font-size="8" fill="#4180B6">4.9s</text>
    <rect x="28" y="430.9" width="25" height="9.1" rx="2" fill="url(#mlx)"/>
    <text x="40" y="427" text-anchor="middle" font-size="8" fill="#D4692A">0.3s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">5Kx100</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">15x</text>
  </g>

  <!-- 10Kx100: WGPU=6.13 MLX=0.78 -->
  <g transform="translate(364,0)">
    <rect x="0" y="275.8" width="25" height="164.2" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="271" text-anchor="middle" font-size="8" fill="#4180B6">6.1s</text>
    <rect x="28" y="419.1" width="25" height="20.9" rx="2" fill="url(#mlx)"/>
    <text x="40" y="415" text-anchor="middle" font-size="8" fill="#D4692A">0.8s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">10Kx100</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">7.8x</text>
  </g>

  <!-- 20Kx100: WGPU=7.37 MLX=2.22 -->
  <g transform="translate(432,0)">
    <rect x="0" y="242.6" width="25" height="197.4" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="238" text-anchor="middle" font-size="8" fill="#4180B6">7.4s</text>
    <rect x="28" y="380.5" width="25" height="59.5" rx="2" fill="url(#mlx)"/>
    <text x="40" y="376" text-anchor="middle" font-size="8" fill="#D4692A">2.2s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">20Kx100</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">3.3x</text>
  </g>

  <!-- 2Kx500 (high-dim): WGPU=7.43 MLX=0.27 -->
  <g transform="translate(500,0)">
    <rect x="0" y="241.0" width="25" height="199.0" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="237" text-anchor="middle" font-size="8" fill="#4180B6">7.4s</text>
    <rect x="28" y="432.8" width="25" height="7.2" rx="2" fill="url(#mlx)"/>
    <text x="40" y="429" text-anchor="middle" font-size="8" fill="#D4692A">0.3s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">2Kx500</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">28x</text>
  </g>

  <!-- 5Kx784 (MNIST-like): WGPU=8.69 MLX=0.71 -->
  <g transform="translate(568,0)">
    <rect x="0" y="207.2" width="25" height="232.8" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="203" text-anchor="middle" font-size="8" fill="#4180B6">8.7s</text>
    <rect x="28" y="421.0" width="25" height="19.0" rx="2" fill="url(#mlx)"/>
    <text x="40" y="417" text-anchor="middle" font-size="8" fill="#D4692A">0.7s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">5Kx784</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">12x</text>
  </g>

  <!-- 5Kx100 deep [256,128,64]: WGPU=9.93 MLX=0.44 -->
  <g transform="translate(636,0)">
    <rect x="0" y="173.9" width="25" height="266.1" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="170" text-anchor="middle" font-size="8" fill="#4180B6">9.9s</text>
    <rect x="28" y="428.2" width="25" height="11.8" rx="2" fill="url(#mlx)"/>
    <text x="40" y="424" text-anchor="middle" font-size="8" fill="#D4692A">0.4s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">deep</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">23x</text>
  </g>

  <!-- 5Kx100 3D: WGPU=12.31 MLX=0.33 -->
  <g transform="translate(704,0)">
    <rect x="0" y="110.2" width="25" height="329.8" rx="2" fill="url(#wgpu)"/>
    <text x="12" y="106" text-anchor="middle" font-size="8" fill="#4180B6">12.3s</text>
    <rect x="28" y="431.2" width="25" height="8.8" rx="2" fill="url(#mlx)"/>
    <text x="40" y="427" text-anchor="middle" font-size="8" fill="#D4692A">0.3s</text>
    <text x="26" y="456" text-anchor="middle" font-size="9" fill="#555">3D out</text>
    <text x="26" y="468" text-anchor="middle" font-size="8" font-weight="600" fill="#D4692A">38x</text>
  </g>

  <!-- Legend -->
  <rect x="260" y="492" width="14" height="10" rx="2" fill="url(#wgpu)"/>
  <text x="280" y="501" font-size="11" fill="#555">WGPU (Metal via WebGPU)</text>
  <rect x="450" y="492" width="14" height="10" rx="2" fill="url(#mlx)"/>
  <text x="470" y="501" font-size="11" fill="#555">MLX (Apple native)</text>

  <!-- 50K note -->
  <text x="400" y="510" text-anchor="middle" font-size="9" fill="#999">50K samples: MLX 14.0s (WGPU skipped — would need 10GB for pairwise matrix)</text>
</svg>
